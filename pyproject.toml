[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.1.0"
description = "Production-grade IP discovery and availability tracking platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "alembic>=1.13.0",
    "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends() in function arguments
    "RUF012",  # Mutable class attribute defaults
    "BLE001",  # Do not catch blind exception (SSRF/security code needs broad catches)
    "G201",    # .error(exc_info=True) is fine
    "S110",    # try-except-pass is intentional for SSRF fail-closed
    "SIM103",  # Return bool directly (readability preference)
]
per-file-ignores."tests/*" = [
    "F401",    # Unused imports (pytest fixtures)
    "F841",    # Unused local variables
    "RUF015",  # Prefer next() over single-element slice
]
